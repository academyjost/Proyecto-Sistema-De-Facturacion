<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Sistema.css">
    <title>Sistema de Facturación SRI</title>
</head>
<body>
    <h1>Sistema de Facturación (Apegado al SRI)</h1>

    <h2>1. Cliente</h2>
    <form id="formCliente">
        <input type="text" id="nombreCli" placeholder="Nombre completo" required>
        <input type="text" id="cedulaCli" placeholder="Cédula o RUC (SRI)" required>
        <button type="button" onclick="guardarCliente()">Guardar Cliente</button>
    </form>

    <h2>2. Inventario</h2>
    <form id="formInventario">
        <input type="text" id="nombreProd" placeholder="Nombre del producto" required>
        <input type="number" id="precioProd" placeholder="Precio Unitario" required>
        <input type="number" id="stockProd" placeholder="Cantidad en stock" required>
        <button type="button" onclick="guardarProducto()">Agregar al Inventario</button>
    </form>

    <h2>3. Punto de Venta</h2>
    <h3>Añadir producto a la compra</h3>
    <form id="formVenta">
        <input type="text" id="ventaProd" placeholder="Nombre del producto a vender" required>
        <input type="number" id="ventaCant" placeholder="Cantidad a vender" required>
        <button type="button" onclick="agregarAlCarrito()">Agregar al carrito</button>
    </form>

    <h3>Emitir Comprobante</h3>
    <button type="button" onclick="generarFactura()">Generar Factura SRI</button>

    <h2>Resultado de la Factura:</h2>
    <h3 id="pantallaFactura">Aún no hay facturas generadas.</h3>

    <script src="Sistema.js"></script>
</body>
</html>
